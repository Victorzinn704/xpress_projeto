name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Flask and JavaScript smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q backend
          node --check static/js/main.js
          node --check static/js/cadastro.js
      - name: Exercise local Flask routes
        run: |
          python - <<'PY'
          from backend.app import app

          app.config['TESTING'] = True
          with app.test_client() as client:
              for path in ('/', '/login', '/cadastro', '/dashboard'):
                  response = client.get(path)
                  assert response.status_code == 200, (path, response.status_code)
              response = client.get('/dados-vendas')
              assert response.status_code == 200
              assert isinstance(response.get_json(), list)
          PY
